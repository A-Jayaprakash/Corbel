services:
  mongo:
    image: mongo:7
    container_name: corbel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: corbel-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/corbel

volumes:
  mongo_data:
