name: Automated Tests & Quality Checks

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run linter
        working-directory: ./backend
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run unit tests
        working-directory: ./backend
        run: npm run test:unit -- --coverage

      - name: Run integration tests
        working-directory: ./backend
        run: npm run test:integration --if-present
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: backend/coverage/

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 📊 Test Results\n\n';
            
            // Check if coverage file exists and read it
            const coveragePath = 'backend/coverage/coverage-summary.json';
            if (fs.existsSync(coveragePath)) {
              try {
                const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
                const total = coverage.total;
                
                comment += `### Coverage Report\n\n| Metric | Coverage |\n|--------|----------|\n`;
                comment += `| Lines | ${total.lines.pct}% |\n`;
                comment += `| Statements | ${total.statements.pct}% |\n`;
                comment += `| Functions | ${total.functions.pct}% |\n`;
                comment += `| Branches | ${total.branches.pct}% |\n\n`;
              } catch (error) {
                comment += `⚠️ Coverage report could not be parsed\n\n`;
              }
            } else {
              comment += `⚠️ Coverage report not available\n\n`;
            }
            
            comment += `✅ Test workflow completed!`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        working-directory: ./backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check code formatting with Prettier
        working-directory: ./backend
        run: npm run format -- --check
        continue-on-error: true

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint
        continue-on-error: true

  test-results:
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    if: always()
    
    steps:
      - name: Check test status
        if: needs.test.result == 'failure'
        run: exit 1
        
      - name: Success notification
        if: success()
        run: echo "✅ All checks passed!"
