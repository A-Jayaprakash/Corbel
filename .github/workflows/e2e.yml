name: E2E Tests

on:
  schedule:
    - cron: "0 2 * * *" # daily at 2 AM UTC
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run E2E tests
        working-directory: backend
        run: npm run test:e2e -- --ci
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/corbel-e2e
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-do-not-use' }}

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: backend/test-results/
          if-no-files-found: ignore
